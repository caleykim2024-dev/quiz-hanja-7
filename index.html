<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5FA">/}|\
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘의 문제">
<title>오늘의 문제</title>
<script src="./config.js"></script>
<script>
const sharedQuizBase=(location.hostname==='127.0.0.1'||location.hostname==='localhost')
  ?'http://127.0.0.1:8002'
  :'https://caleykim2024-dev.github.io/hanja-8';
document.write('<link rel="stylesheet" href="'+sharedQuizBase+'/quiz.css">');
document.write('<script src="'+sharedQuizBase+'/quiz-card.js"><\/script>');
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

</head>
<body>
<div id="app"></div>

<script>
/* ============ 상태 ============ */
const LS_STATE='quizState.v1', LS_CFG='quizCfg.v1';
const LS_AUTH='quizAuth.v1';
let Q=[], QB={}, DECKS=[], S=null, loadErr='';
const savedCfg=JSON.parse(localStorage.getItem(LS_CFG)||'{}');
const publicConfig=window.APP_CONFIG||{};
let cfg={url:publicConfig.SUPABASE_URL||'',key:publicConfig.SUPABASE_ANON_KEY||'',email:savedCfg.email||''};
let authSession=JSON.parse(localStorage.getItem(LS_AUTH)||'null');
let view='home', cur=0, curDeck='', quizMode='today', syncStatus='', pushTimer=null, settingsMsg='', flipJustAnswered=false;
const $app=document.getElementById('app');

const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function defaultState(){return {v:2,updatedAt:0,perDay:10,stats:{},queue:[],days:{}};}
function migrate(raw){
  const s=Object.assign(defaultState(),raw||{});
  if(!s.days)s.days={};
  if(s.today){ if(!Object.keys(s.days).length)s.days['어휘']=s.today; delete s.today; }
  s.v=2;return s;
}
function loadLocal(){try{return migrate(JSON.parse(localStorage.getItem(LS_STATE)||'{}'));}catch(_){return defaultState();}}
function save(){S.updatedAt=Date.now();localStorage.setItem(LS_STATE,JSON.stringify(S));schedulePush();}
const TD=()=>S.days[curDeck];

/* ============ 오늘 문제 뽑기 (분류별로 따로) ============ */
function buildToday(deck){
  return QuizCard.buildToday(deck,todayStr(),10,Q,QB,S.stats,S.queue);
}

function ensureToday(){
  if(!Q.length)return false;
  let rebuilt=false;
  for(const d of DECKS){
    const old=S.days[d];
    const current=QuizCard.ensureSections(old,d,todayStr(),10,Q,QB,S.stats,S.queue);
    if(JSON.stringify(old)!==JSON.stringify(current)){S.days[d]=current;rebuilt=true;}
  }
  if(rebuilt)save();
  return rebuilt;
}

/* ============ 동기화 (Supabase Auth + RLS) ============ */
const configReady=()=>Boolean(cfg.url&&cfg.key&&!cfg.url.includes('YOUR_')&&!cfg.key.includes('YOUR_'));
const syncOn=()=>Boolean(configReady()&&authSession&&authSession.access_token);
const base=()=>cfg.url.replace(/\/+$/,'')+'/rest/v1/vocab_quiz_progress';
const hdr=()=>({apikey:cfg.key,Authorization:'Bearer '+(authSession?.access_token||cfg.key),'Content-Type':'application/json'});
function keepSession(data){
  authSession={access_token:data.access_token,refresh_token:data.refresh_token,
    expires_at:Date.now()+((data.expires_in||3600)*1000),user:data.user};
  localStorage.setItem(LS_AUTH,JSON.stringify(authSession));
}
async function refreshSession(){
  if(!authSession?.refresh_token||!cfg.url||!cfg.key)return false;
  const r=await fetch(cfg.url.replace(/\/+$/,'')+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:authSession.refresh_token})});
  if(!r.ok){authSession=null;localStorage.removeItem(LS_AUTH);return false;}
  keepSession(await r.json());return true;
}
async function ensureSession(){
  if(!syncOn())return false;
  if(authSession.expires_at>Date.now()+60000)return true;
  return refreshSession();
}
function mergeStates(left,right){
  const a=migrate(left),b=migrate(right),m=defaultState();
  const newer=b.updatedAt>=a.updatedAt?b:a;
  m.perDay=newer.perDay;m.updatedAt=Math.max(a.updatedAt,b.updatedAt);
  m.stats={};
  for(const id of new Set([...Object.keys(a.stats||{}),...Object.keys(b.stats||{})])){
    const x=a.stats[id]||{},y=b.stats[id]||{};
    m.stats[id]={seen:Math.max(x.seen||0,y.seen||0),wrong:Math.max(x.wrong||0,y.wrong||0),last:(x.last||'')>(y.last||'')?(x.last||''):(y.last||'')};
  }
  m.queue=QuizCard.mergeQueue(a.queue,b.queue);m.days={};
  for(const deck of new Set([...Object.keys(a.days||{}),...Object.keys(b.days||{})])){
    const x=a.days[deck],y=b.days[deck];
    if(!x){m.days[deck]=y;continue;} if(!y){m.days[deck]=x;continue;}
    if(x.date!==y.date){m.days[deck]=String(x.date)>String(y.date)?x:y;continue;}
    const ids=[...new Set([...(x.ids||[]),...(y.ids||[])])],res={};
    for(const id of ids){
      const rx=x.res?.[id],ry=y.res?.[id];
      if(!rx)res[id]=ry;else if(!ry)res[id]=rx;
      else res[id]=(ry.changedAt||0)>(rx.changedAt||0)?ry:rx;
    }
    const reviewIds=[...new Set([...(x.reviewIds||x.wrongFrom||[]),...(y.reviewIds||y.wrongFrom||[])])];
    const todayIds=[...new Set([...(x.todayIds||x.ids?.filter(id=>!(x.wrongFrom||[]).includes(id))||[]),
      ...(y.todayIds||y.ids?.filter(id=>!(y.wrongFrom||[]).includes(id))||[])])];
    m.days[deck]={...x,...y,ids,reviewIds,todayIds,wrongFrom:reviewIds,res};
  }
  return m;
}
function setSync(s){syncStatus=s;const el=document.getElementById('sync');if(el){el.textContent=syncText();el.className='sync'+(s==='err'?' err':'');}}
function syncText(){return !syncOn()?'Supabase 로그인 필요':syncStatus==='err'?'동기화 실패 (연결을 확인해 주세요)':syncStatus==='ok'?'모든 기기와 동기화됨':'동기화 중…';}
async function pull(){
  if(!syncOn())return false;
  try{
    await ensureSession();
    const userId=authSession.user.id;
    const r=await fetch(base()+'?user_id=eq.'+encodeURIComponent(userId)+'&select=data',{headers:hdr()});
    if(!r.ok)throw new Error(r.status);
    const rows=await r.json(); setSync('ok');
    // 로컬 상태와 서버 상태를 합쳐 양쪽 기록을 보존합니다.
    const before=JSON.stringify(S),remote=rows[0]?.data||defaultState();
    S=mergeStates(S,remote);localStorage.setItem(LS_STATE,JSON.stringify(S));
    await push();
    return before!==JSON.stringify(S);
  }catch(_){setSync('err');return false;}
}
async function push(){
  if(!syncOn())return;
  try{
    await ensureSession();
    const r=await fetch(base(),{method:'POST',headers:{...hdr(),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:authSession.user.id,data:S,updated_at:new Date().toISOString()})});
    if(!r.ok)throw new Error(r.status); setSync('ok');
  }catch(_){setSync('err');}
}
function schedulePush(){if(!syncOn())return;clearTimeout(pushTimer);pushTimer=setTimeout(push,700);}

/* ============ 화면 ============ */
const sectionIds=(t,mode=quizMode)=>t?.[mode==='review'?'reviewIds':'todayIds']||[];
const modeTitle=mode=>mode==='review'?'복습':'오늘의 풀이';
function dotsHtml(deck,mode,clickable){
  const t=S.days[deck];
  return '<div class="dots">'+sectionIds(t,mode).map((id,i)=>{
    const r=t.res[id];
    const cls=r&&r.tries>0?(isOk(t,id)?'ok':'ng'):'';
    const c=(clickable&&view==='quiz'&&mode===quizMode&&i===cur)?' cur':'';
    return clickable
      ?`<button class="dot ${cls}${c}" onclick="go(${i})" aria-label="${i+1}번 문제">${i+1}</button>`
      :`<span class="dot ${cls}">${i+1}</span>`;
  }).join('')+'</div>';
}
function doneCount(deck,mode){const t=S.days[deck];return sectionIds(t,mode).filter(id=>t.res[id]&&t.res[id].tries>0).length;}
// 가장 최근에 푼 답이 맞았으면 '맞음' (틀렸다가 다시 풀어 맞혀도 맞은 것으로 센다)
function isOk(t,id){const r=t.res[id];if(!r||!(r.tries>0))return false;
  if(r.ok!==undefined)return r.ok;
  return r.picked!=null?r.picked===QB[id].answer:!r.everWrong;}

function render(){
  if(loadErr){$app.innerHTML=`<h1>문제를 불러오지 못했어요</h1><div class="err-box">${e(loadErr)}</div>`;return;}
  if(!S){$app.innerHTML='<p class="sub">불러오는 중…</p>';return;}
  if(!Q.length&&view!=='settings'){
    $app.innerHTML=`<div class="top"><span></span><button class="icon-btn" onclick="openSettings()" aria-label="설정">⚙</button></div>
      <h1>문제가 아직 없어요</h1><p class="sub">설정에서 엑셀을 변환해 questions.json을 만든 뒤, index.html과 같은 폴더에 넣어주세요.</p>`;return;}
  if(view==='settings')return renderSettings();
  if(view==='quiz')return renderQuiz();
  if(view==='result')return renderResult();
  renderHome();
}

function renderHome(){
  const d=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
  const cards=mode=>DECKS.map((dk,i)=>{
    const t=S.days[dk],n=sectionIds(t,mode).length,done=doneCount(dk,mode);
    const all=Q.filter(q=>q.deck===dk);
    const seen=all.filter(q=>(S.stats[q.id]||{}).seen>0).length;
    const pending=S.queue.filter(x=>x.stage!=='done'&&QB[x.id]&&QB[x.id].deck===dk).length;
    const nextReview=S.queue.filter(x=>x.stage!=='done'&&QB[x.id]?.deck===dk&&QuizCard.queueDue(x)>todayStr()).map(QuizCard.queueDue).sort()[0];
    const label=done===0?'시작하기':done<n?'이어서 풀기':'결과 보기';
    return `<div class="panel">
      <div class="deckhead"><b>${e(dk)}</b><span>${n}문제 · 완료 ${done}개</span></div>
      ${n?dotsHtml(dk,mode,false):`<p class="empty-review">${mode==='review'?'오늘 복습할 문제가 없어요.':'오늘 풀 새 문제가 없어요.'}</p>`}
      <p class="deckmeta">${mode==='review'?`다시 나올 오답 ${pending}개${!n&&nextReview?` · 다음 복습 ${nextReview}`:''}`:`풀어본 문제 ${seen}/${all.length} · 새 문제 ${n}개`}</p>
      ${n?`<button class="btn start" onclick="start(${i},'${mode}')">${label}</button>`:''}
    </div>`;
  }).join('');
  $app.innerHTML=`
    <div class="top"><span class="sync" id="sync">${syncText()}</span><button class="icon-btn" onclick="openSettings()" aria-label="설정">⚙</button></div>
    <h1>${e(d)}</h1>
    <p class="sub">복습과 오늘의 풀이를 따로 진행해요.</p>
    <section class="home-section"><h2>복습</h2>${cards('review')}</section>
    <section class="home-section"><h2>오늘의 풀이</h2>${cards('today')}</section>`;
}

function renderQuiz(){
  const t=TD();
  if(!t){view='home';return render();}
  const ids=sectionIds(t),id=ids[cur],q=QB[id];
  if(!q){view='home';return render();}
  const r=t.res[id]||{},answered=r.picked!=null;
  const isReview=quizMode==='review';
  const flipping=answered&&flipJustAnswered;
  flipJustAnswered=false;
  const last=cur===ids.length-1;
  const footer=answered?`<div class="footer"><div class="row">
      <button class="btn ghost" onclick="retry()">다시 풀기</button>
      <button class="btn" onclick="next()">${last?'결과 보기':'다음 문제'}</button></div></div>`:'';
  $app.innerHTML=`
    <div class="top"><button class="icon-btn" onclick="home()" aria-label="처음으로">←</button><span class="sync">${e(curDeck)} · ${cur+1} / ${ids.length}</span><span style="width:44px"></span></div>
    <span class="mode-chip">${modeTitle(quizMode)}</span>
    ${dotsHtml(curDeck,quizMode,true)}
    ${QuizCard.render(q,r.picked,isReview,flipping,e)}${footer}`;
  QuizCard.focus(answered);
}

function renderResult(){
  const t=TD(),ids=sectionIds(t),n=ids.length;
  const wrong=ids.filter(id=>t.res[id]&&t.res[id].everWrong);
  const good=ids.filter(id=>isOk(t,id)).length;
  const label=id=>{const q=QB[id];return q.big?q.big+'  '+q.choices[q.answer]:q.question.slice(0,60)+(q.question.length>60?'…':'');};
  $app.innerHTML=`
    <div class="top"><button class="icon-btn" onclick="home()" aria-label="처음으로">←</button><span class="sync">${e(curDeck)} · ${modeTitle(quizMode)}</span><span style="width:44px"></span></div>
    <h1>${modeTitle(quizMode)} 완료!</h1>
    <p class="sub">맞힌 문제</p>
    <div class="big">${good}<small> / ${n}</small></div>
    ${dotsHtml(curDeck,quizMode,false)}
    ${wrong.length?`<h2>다음에 다시 나오는 문제</h2><ul class="wrong-list">${wrong.map(id=>`<li>${e(label(id))}${isOk(t,id)?' · 다시 풀어서 맞힘':''}</li>`).join('')}</ul>`:''}
    <div class="footer"><div class="row"><button class="btn ${quizMode==='review'?'ghost':''}" onclick="home()">처음으로</button>${quizMode==='review'?`<button class="btn" onclick="start(${DECKS.indexOf(curDeck)},'today')">오늘의 풀이</button>`:''}</div></div>`;
  window.scrollTo(0,0);
}

function renderSettings(){
  $app.innerHTML=`
    <div class="top"><button class="icon-btn" onclick="home()" aria-label="뒤로">←</button><span></span><span style="width:44px"></span></div>
    <h1>설정</h1>

    <h2>오늘의 풀이</h2>
    <div class="panel">
      <p class="help" style="margin-top:0">매일 새 문제 10개와 복습 문제를 따로 뽑아요.</p>
      <button class="btn small ghost" style="margin-top:12px" onclick="rebuildToday()">오늘 문제 다시 뽑기</button>
    </div>

    <h2>여러 기기에서 기록 같이 쓰기</h2>
    <div class="panel">
      <p class="help" style="margin-top:0">한 번 계정을 연결하면 이 기기의 기존 기록을 Supabase 기록과 합쳐 저장해요. 다른 기기에서도 같은 계정으로 로그인하세요.</p>
      <p class="help">Supabase 주소와 공개 키는 <b>config.js</b>에서 읽습니다. ${configReady()?'공통 설정이 적용되어 있어요.':'config.js에 Supabase URL과 anon public key를 먼저 입력해 주세요.'}</p>
      <label for="cEmail">계정 이메일</label><input type="text" id="cEmail" value="${e(cfg.email||'')}" placeholder="이메일 주소" autocomplete="username">
      <label for="cPassword">비밀번호</label><input type="password" id="cPassword" placeholder="Supabase 계정 비밀번호" autocomplete="current-password">
      <div style="display:flex;gap:10px;margin-top:14px;align-items:center">
        <button class="btn small" onclick="saveSync()">로그인 및 동기화</button>
        <button class="btn small ghost" onclick="createSyncAccount()">계정 만들기</button>
        <span class="sync" id="sync">${syncText()}</span>
      </div>
      ${authSession?.user?.email?`<p class="help">연결 계정: ${e(authSession.user.email)} <button class="btn small ghost" onclick="signOut()">로그아웃</button></p>`:''}
      <div class="msg" id="syncMsg">${e(settingsMsg)}</div>
      <p class="help">로그인하면 이 기기의 기존 풀이 기록과 Supabase 기록을 합쳐요. 계정 이메일과 비밀번호는 기기 간 기록 공유용으로 사용합니다.</p>
    </div>

    <h2>엑셀 → 문제 파일 변환</h2>
    <div class="panel">
      <p class="help" style="margin-top:0">어휘 엑셀과 한자 엑셀을 <b>한꺼번에 같이 선택</b>하면 하나의 questions.json으로 합쳐서 내려받아져요. 파일은 열 이름으로 자동 구분해요.</p>
      <p class="help">어휘: ID, 어휘, 설명, 예문, 보기 1~4, 정답<br>한자: ID, 한자, 보기 1~4, 정답, 정답텍스트, 설명<br>그 밖: ID, 문제, 보기 1~5, 정답, 풀이, 분류(선택)</p>
      <input type="file" id="xl" accept=".xlsx,.xls,.csv" multiple onchange="convertXlsx(this.files)">
      <div class="msg" id="convMsg">${e(settingsMsg)}</div>
    </div>

    <h2>기록 지우기</h2>
    <button class="btn danger" onclick="resetAll()">이 기기와 동기화된 모든 기록 삭제</button>`;
  window.scrollTo(0,0);
}

/* ============ 동작 ============ */
function go(i){cur=i;render();}
function home(){view='home';render();}
function openSettings(){view='settings';render();}
function start(i,mode='today'){
  curDeck=DECKS[i];
  quizMode=mode;
  const t=TD();
  const ids=sectionIds(t);
  if(!ids.length){view='home';return render();}
  if(doneCount(curDeck,mode)>=ids.length){view='result';return render();}
  cur=Math.max(0,ids.findIndex(id=>!(t.res[id]&&t.res[id].tries>0)));
  view='quiz';render();
}
function pick(i){
  const t=TD(),id=sectionIds(t)[cur],q=QB[id];
  const r=t.res[id]||(t.res[id]={tries:0,everWrong:false,picked:null});
  if(r.picked!=null)return;
  r.picked=i;r.tries++;r.ok=(i===q.answer);r.changedAt=Date.now();
  const st=S.stats[id]||(S.stats[id]={seen:0,wrong:0,last:''});
  if(r.tries===1){st.seen++;st.last=t.date;}
  if(i!==q.answer&&!r.everWrong){r.everWrong=true;st.wrong++;}
  S.queue=QuizCard.afterAnswer(S.queue,id,t.date,i===q.answer,r.everWrong,r.changedAt);
  save();flipJustAnswered=true;render();
}

function retry(){const t=TD(),r=t.res[sectionIds(t)[cur]];if(r){r.picked=null;save();render();}}
function next(){
  if(cur<sectionIds(TD()).length-1){cur++;render();}
  else{view='result';render();}
}
function rebuildToday(){
  if(!confirm('오늘 푼 기록이 사라지고 모든 분류의 문제를 새로 뽑아요. 계속할까요?'))return;
  S.queue=S.queue.filter(x=>x.date!==todayStr());
  DECKS.forEach(d=>{S.days[d]=buildToday(d);});
  save();view='home';render();
}
async function saveSync(){
  const msg=document.getElementById('syncMsg');
  cfg.email=document.getElementById('cEmail').value.trim();
  localStorage.setItem(LS_CFG,JSON.stringify({email:cfg.email}));
  setSync('');
  const password=document.getElementById('cPassword').value;
  if(!configReady()||!cfg.email||!password){if(msg)msg.textContent='config.js 설정과 이메일, 비밀번호를 확인해 주세요.';return;}
  try{
    const r=await fetch(cfg.url.replace(/\/+$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},body:JSON.stringify({email:cfg.email,password})});
    const body=await r.json();if(!r.ok)throw new Error(body.msg||body.message||body.error_description||'로그인에 실패했어요.');
    keepSession(body);if(msg)msg.textContent='이 기기의 기록을 서버 기록과 합치는 중…';
    await pull();ensureToday();
    if(msg)msg.textContent=syncStatus==='err'?'로그인은 됐지만 동기화에 실패했어요. Supabase SQL 설정을 확인해 주세요.':'기존 기기 기록을 포함해 동기화했어요.';
  }catch(err){authSession=null;localStorage.removeItem(LS_AUTH);setSync('err');if(msg)msg.textContent=err.message;}
  settingsMsg=msg?.textContent||'';
  render();
}
async function createSyncAccount(){
  const msg=document.getElementById('syncMsg');
  cfg.email=document.getElementById('cEmail').value.trim();
  localStorage.setItem(LS_CFG,JSON.stringify({email:cfg.email}));
  const password=document.getElementById('cPassword').value;
  if(!configReady()||!cfg.email||!password){if(msg)msg.textContent='config.js 설정과 이메일, 비밀번호를 확인해 주세요.';return;}
  try{
    const r=await fetch(cfg.url.replace(/\/+$/,'')+'/auth/v1/signup',{method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},body:JSON.stringify({email:cfg.email,password})});
    const body=await r.json();if(!r.ok)throw new Error(body.msg||body.message||body.error_description||'계정을 만들지 못했어요.');
    if(body.access_token){keepSession(body);await pull();if(msg)msg.textContent='계정을 만들고 이 기기의 기록을 동기화했어요.';}
    else if(msg)msg.textContent='계정을 만들었어요. 이메일 인증을 마친 뒤 로그인 및 동기화를 눌러 주세요.';
  }catch(err){if(msg)msg.textContent=err.message;}
  settingsMsg=msg?.textContent||'';
  render();
}
function signOut(){authSession=null;localStorage.removeItem(LS_AUTH);setSync('');settingsMsg='로그아웃했어요. 이 기기 기록은 그대로 보관됩니다.';render();}

/* ============ 엑셀 변환 ============ */
/*CONVERT_START*/
const TEXT_FIXES=[['보 거나','보거나'],['만 큼','만큼'],['나아 지는','나아지는'],['내 는 것','내는 것'],['통융성','융통성'],['사업 이 잘되다','사업이 잘되다'],['재주..','재주.']];
function convertRows(rows,fileName){
  const list=[],notes=[],fixed={};
  const clean=s=>{
    s=String(s).trim();
    for(const [a,b] of TEXT_FIXES){ if(s.includes(a)){fixed[a]=(fixed[a]||0)+s.split(a).length-1;s=s.split(a).join(b);} }
    if(s.endsWith(',')){fixed['끝 쉼표']=(fixed['끝 쉼표']||0)+1;s=s.slice(0,-1)+'.';}
    return s;
  };
  rows.forEach((row,i)=>{
    const rowNo=i+2, where='['+fileName+'] '+rowNo+'행: ';
    const m={};for(const k in row)m[String(k).replace(/\s+/g,'').toLowerCase()]=row[k];
    const get=(...names)=>{for(const n of names){if(m[n]!==undefined&&String(m[n]).trim()!=='')return m[n];}return '';};
    const vocab=String(get('어휘','낱말','단어','vocab','word')).trim();
    const hanja=String(get('한자','hanja')).trim();
    let question=String(get('문제','question','질문')).trim();
    let deck=String(get('분류','과목','deck')).trim(), big='', kind='generic';
    if(!question&&vocab){question='‘'+vocab+'’의 뜻으로 알맞은 것은?';deck=deck||'어휘';kind='vocab';}
    else if(!question&&hanja){question='다음 한자의 뜻(훈)과 소리(음)로 알맞은 것은?';big=hanja;deck=deck||'한자';kind='hanja';}
    if(!question)return;
    deck=deck||fileName.replace(/\.[^.]+$/,'')||'문제';
    const choices=[];
    for(let n=1;n<=5;n++){
      const v=get('보기'+n,'선택지'+n,'선택'+n,'choice'+n,n+'번',String(n),'①②③④⑤'[n-1]);
      if(v!=='')choices.push(clean(v));
    }
    const a=String(get('정답','answer','답')).trim();
    let idx=-1;const dm=a.match(/^\d+/);
    if(dm)idx=parseInt(dm[0],10)-1;
    else if('①②③④⑤'.includes(a[0]||'x'))idx='①②③④⑤'.indexOf(a[0]);
    else if(/^[A-Ea-e]$/.test(a))idx='abcde'.indexOf(a.toLowerCase());
    if(choices.length<2){notes.push(where+'보기가 2개 미만이라 뺐어요');return;}
    if(idx<0||idx>=choices.length){notes.push(where+'정답을 읽을 수 없어 뺐어요("'+a+'")');return;}
    if(new Set(choices).size!==choices.length)notes.push(where+'똑같은 보기가 있어요. 확인해 주세요');
    let expl='';
    if(kind==='vocab'){
      const desc=clean(get('설명','뜻','desc')), ex=clean(get('예문','example'));
      if(desc&&choices[idx]!==desc)notes.push(where+'정답 보기와 설명이 달라요. 확인해 주세요');
      expl=vocab+': '+(desc||choices[idx])+(ex?'\n\n예문: '+ex:'');
    }else if(kind==='hanja'){
      const at=clean(get('정답텍스트','answertext')), why=clean(get('설명','풀이','해설','explanation'));
      if(at&&choices[idx]!==at)notes.push(where+'정답텍스트와 정답 번호의 보기가 달라요. 확인해 주세요');
      expl=hanja+' → '+(at||choices[idx])+(why?'\n\n'+why:'');
    }else{
      expl=clean(get('풀이','해설','설명','explanation'));
    }
    let id=get('번호','id','no');
    id=id!==''&&!isNaN(id)?Number(id):(id||rowNo-1);
    if(deck!=='어휘')id=deck+'-'+id;
    const o={id,deck,question};
    if(big)o.big=big;
    o.choices=choices;o.answer=idx;o.explanation=expl;
    const img=String(get('이미지','image')).trim();if(img)o.image=img;
    list.push(o);
  });
  return {list,notes,fixed};
}
/*CONVERT_END*/
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('변환 도구를 불러오지 못했어요. 인터넷 연결을 확인하세요.'));document.head.appendChild(s);});}
async function convertXlsx(files){
  const out=document.getElementById('convMsg');
  if(!files||!files.length)return;
  try{
    out.textContent='변환 중…';
    if(!window.XLSX)await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    let all=[],notes=[];const fixed={};
    for(const f of Array.from(files)){
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      const r=convertRows(rows,f.name);
      all=all.concat(r.list);notes=notes.concat(r.notes);
      for(const k in r.fixed)fixed[k]=(fixed[k]||0)+r.fixed[k];
    }
    const seen=new Set(),dups=[];
    all.forEach(x=>{if(seen.has(x.id))dups.push(x.id);seen.add(x.id);});
    if(dups.length)notes.push('ID가 겹쳐요: '+dups.slice(0,10).join(', ')+' (분류마다 ID는 1, 2, 3…처럼 서로 달라야 해요)');
    const counts={};all.forEach(x=>{counts[x.deck]=(counts[x.deck]||0)+1;});
    const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
    const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='questions.json';a2.click();
    const fx=Object.keys(fixed).length?'\n자동으로 고친 글자: '+Object.entries(fixed).map(([k,v])=>k+' '+v+'곳').join(', '):'';
    out.textContent=Object.entries(counts).map(([k,v])=>k+' '+v+'문제').join(', ')+'를 합쳐 questions.json으로 내려받았어요.'+fx
      +(notes.length?'\n\n확인이 필요한 항목:\n'+notes.join('\n'):'')
      +'\n\n이 파일을 index.html과 같은 폴더에 넣고 다시 올려주세요.';
  }catch(err){out.textContent='변환 실패: '+err.message;}
}
